[package]
name = "lyncost"
version = "1.1.1"
description = "Lyncost - 100% Offline, Privacy-First Personal Finance & Investment Tracker"
authors = ["UltraDarshan <darshantech@proton.me>", "Wintershogun TechLabs"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/UltraDarshan/lyncost"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lyncost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.17"
dirs = "6"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
data-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# No "zip": Windows updates are the signed setup.exe itself, never an archive.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[features]
# QA builds: accept keys signed by the test key in scripts/license, and let tests move the clock.
qa = []
# Enforce the Windows license on other platforms (for local testing on Linux).
license-gate = []

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
