[package]
name = "lyncost"
version = "0.1.9"
description = "Lyncost - 100% Offline, Privacy-First Personal Finance & Investment Tracker"
authors = ["Wintershogun TechLabs"]
edition = "2021"

[lib]
name = "lyncost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
