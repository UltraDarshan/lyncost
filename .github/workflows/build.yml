name: Build Lyncost

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Rust tests (unit + IPC contract)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows license tests (QA key, gate on)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features qa,license-gate license
      - name: Frontend/backend contract check
        run: python3 scripts/check-ipc-contract.py

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - name: Check dependencies for known vulnerabilities (RustSec)
        working-directory: src-tauri
        run: cargo audit

  build-linux:
    needs: test
    # Oldest supported runner = oldest glibc = widest compatibility for the packages.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build RPM, DEB and AppImage
        run: npx tauri build --bundles rpm,deb,appimage
      - name: Collect packages and checksums
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/

  install-test:
    # Install the real packages on each target distro and prove the app starts.
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:43", kind: rpm }
          - { image: "fedora:44", kind: rpm }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "linuxmintd/mint22-amd64", kind: deb }
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - name: Install package
        run: |
          if [ "${{ matrix.kind }}" = rpm ]; then
            dnf install -y ./pkgs/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon procps-ng
          else
            apt-get update -qq
            apt-get install -y -qq ./pkgs/*.deb xvfb xauth dbus procps
          fi
      - name: All libraries resolve
        run: |
          missing="$(ldd /usr/bin/lyncost | grep 'not found' || true)"
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
      - name: App starts and creates its database
        run: |
          useradd -m tester
          su tester -c 'export HOME=/home/tester; \
            timeout 40 dbus-run-session -- xvfb-run -a lyncost >/tmp/lyncost.log 2>&1; code=$?; \
            echo "exit code: $code"; [ "$code" = 124 ]' || { cat /tmp/lyncost.log; exit 1; }
          test -f /home/tester/.local/share/com.lyncost.desktop/lyncost.db
          echo "database created; app ran for 40s without exiting"
      - name: Desktop entry and AppStream data installed
        run: |
          test -f /usr/share/applications/Lyncost.desktop
          test -f /usr/share/metainfo/com.lyncost.desktop.metainfo.xml

  build-windows:
    # The paid Windows edition: NSIS setup wizard + signed update files for the in-app updater.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update files (in-app updates need them)."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Release build trusts only the real license key
        shell: bash
        run: |
          exe=src-tauri/target/release/lyncost.exe
          if grep -aq 50c0a27d8cdd2fb70e4bea9f57938c3060e4e96351bd62d9ce904e12e4d56ad0 "$exe"; then
            echo "::error::The release build contains the QA test key"; exit 1
          fi
          grep -aq 34f9642006dd0abb2d23ccf308c6af3e82669b49f684decf65774cda74c67d0d "$exe"
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/ 2>/dev/null || true
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/

  smoke-windows:
    # Install the real setup.exe silently, start the app, check the trial started, uninstall.
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: win
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem win\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Lyncost\lyncost.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA" | Out-Host; throw "lyncost.exe not installed" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Lyncost*.lnk"
          if (-not $lnk) { throw "No Start menu shortcut" }
          "Installed: $exe"
      - name: App starts, creates its database and starts the trial
        shell: pwsh
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Lyncost\lyncost.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { throw "Lyncost exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$env:APPDATA\com.lyncost.desktop\lyncost.db")) { throw "No database" }
          $ts = (Get-ItemProperty "HKCU:\Software\Wintershogun\Lyncost" -ErrorAction Stop).ts
          if (-not $ts) { throw "Trial was not recorded" }
          "Trial recorded: $ts"
          Stop-Process -Id $p.Id -Force
      - name: Uninstall keeps the user's data
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\Lyncost\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$env:LOCALAPPDATA\Lyncost\lyncost.exe") { throw "App still installed" }
          if (-not (Test-Path "$env:APPDATA\com.lyncost.desktop\lyncost.db")) { throw "Uninstall deleted the user's data" }
          "Uninstalled; data kept"

  qa-windows:
    # Drive the real app on Windows: trial, lock, keys, every feature, layout.
    needs: test
    runs-on: windows-latest
    env:
      LYNCOST_QA_APP: ${{ github.workspace }}\src-tauri\target\debug\lyncost.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the QA app (test license key, movable clock)
        # Same build mode as Tauri's WebDriver guide: a real (embedded-assets) debug build.
        run: npx tauri build --debug --no-bundle --features qa
      - name: Install tauri-driver and the matching Edge WebDriver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          # The driver must match the WebView2 runtime the app uses (not the Edge browser).
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $ver = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $ver) { $ver = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          "WebView2 $ver"
          try { Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile edgedriver.zip }
          catch { Invoke-WebRequest "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip" -OutFile edgedriver.zip }
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          # Wrapper that turns on the driver's detailed log (shown if a test fails).
          Set-Content edgedriver\msedgedriver-log.cmd "@`"%~dp0msedgedriver.exe`" --verbose --log-path=`"%RUNNER_TEMP%\msedgedriver.log`" %*"
      - name: Let the test driver attach to WebView2 (throwaway runner only)
        # WebView2 150+ ignores the debugging switch msedgedriver passes in; the machine-wide
        # policy still works. Never set on users' PCs: this exists only on the CI machine.
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name "lyncost.exe" -Value "--remote-debugging-port=0" -PropertyType String -Force | Out-Null
      - name: QA app starts on its own
        shell: pwsh
        run: |
          $p = Start-Process $env:LYNCOST_QA_APP -PassThru -RedirectStandardError "$env:RUNNER_TEMP\app.err"
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:RUNNER_TEMP\app.err"; throw "QA app exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          # That first start began a trial; clear it so the license test starts fresh.
          Remove-Item "HKCU:\Software\Wintershogun" -Recurse -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Wintershogun", "$env:APPDATA\com.lyncost.desktop" -Recurse -ErrorAction SilentlyContinue
      - name: Trial and license, every feature, layout
        # One step: Windows ends background processes when a step finishes, so the driver
        # has to start in the same step as the tests.
        shell: pwsh
        working-directory: scripts/qa
        run: |
          $driver = Start-Process tauri-driver -ArgumentList "--native-driver", "$env:GITHUB_WORKSPACE\edgedriver\msedgedriver-log.cmd" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\driver.log" -RedirectStandardError "$env:RUNNER_TEMP\driver.err"
          for ($i = 0; $i -lt 30 -and -not (Test-NetConnection 127.0.0.1 -Port 4444 -InformationLevel Quiet -WarningAction SilentlyContinue); $i++) { Start-Sleep 1 }
          function Run($script) { python $script; if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\driver.err", "$env:RUNNER_TEMP\msedgedriver.log" -ErrorAction SilentlyContinue | Select-Object -Last 80; throw "$script failed" } }
          Run license_flows.py
          Run seed.py
          Run flows.py
          python layout_check.py 135790; if ($LASTEXITCODE -ne 0) { throw "layout_check failed" }
          python capture.py page all 135790
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-screenshots
          path: src-tauri/target/qa/shots/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, install-test, smoke-windows, qa-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: win
      - name: Windows installer, update feed, and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          setup="$(cd win && ls *-setup.exe)"
          cp "win/$setup" out/
          if [ -f "win/$setup.sig" ]; then
            jq -n --arg v "$version" --arg sig "$(cat "win/$setup.sig")" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$setup" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: "See what is new at https://github.com/UltraDarshan/lyncost/blob/main/CHANGELOG.md", pub_date: $date,
                platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > out/latest.json
            cat out/latest.json
          else
            echo "::warning::No updater signature: this release has no latest.json, so Windows apps will not see it as an update."
          fi
          (cd out && rm -f SHA256SUMS && sha256sum $(ls | grep -v latest.json) > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          draft: true
